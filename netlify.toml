[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # PostHog project token — public by design (it ships in the client bundle).
  # next.config.ts only exposes it when CONTEXT=production, so previews stay
  # untracked even though the variable is set for every deploy context.
  POSTHOG_PROJECT_TOKEN = "phc_oGJKJ6N8vR4TNfof3955hzyY5tZpkpXbhFBVvAT7hoxk"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect www to non-www
[[redirects]]
  from = "https://www.eggo.fun/*"
  to = "https://eggo.fun/:splat"
  status = 301
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
